{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - IDS</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Rajdhani', sans-serif;
            background: #0d0a10;
            color: #e8d5ea;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-container {
            width: 100%;
            max-width: 380px;
            padding: 20px;
        }

        .login-card {
            background: linear-gradient(145deg, rgba(30, 18, 38, 0.95), rgba(20, 10, 28, 0.95));
            border: 1px solid rgba(255, 105, 180, 0.12);
            border-radius: 14px;
            padding: 36px 30px;
            text-align: center;
        }

        .login-card h2 {
            font-family: 'Orbitron', sans-serif;
            font-size: 20px;
            color: #ff69b4;
            letter-spacing: 2px;
            margin-bottom: 6px;
        }

        .login-subtitle {
            font-size: 13px;
            color: rgba(255, 105, 180, 0.35);
            margin-bottom: 28px;
            letter-spacing: 1px;
        }

        .error-message {
            background: rgba(255, 50, 50, 0.1);
            border: 1px solid rgba(255, 50, 50, 0.2);
            border-radius: 8px;
            padding: 10px 14px;
            color: #ff6666;
            font-size: 13px;
            margin-bottom: 16px;
            text-align: left;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            background: rgba(255, 105, 180, 0.05);
            border: 1px solid rgba(255, 105, 180, 0.15);
            border-radius: 8px;
            color: #e8d5ea;
            font-family: 'Rajdhani', sans-serif;
            font-size: 15px;
            transition: border-color 0.3s ease;
            outline: none;
        }

        .form-group input:focus {
            border-color: rgba(255, 105, 180, 0.4);
            background: rgba(255, 105, 180, 0.08);
        }

        .form-group input::placeholder {
            color: rgba(255, 105, 180, 0.3);
        }

        .login-btn {
            width: 100%;
            padding: 13px;
            background: linear-gradient(135deg, rgba(255, 105, 180, 0.25), rgba(255, 20, 147, 0.35));
            border: 1px solid rgba(255, 105, 180, 0.3);
            border-radius: 8px;
            color: #ff69b4;
            font-family: 'Orbitron', sans-serif;
            font-size: 13px;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 6px;
        }

        .login-btn:hover {
            background: linear-gradient(135deg, rgba(255, 105, 180, 0.35), rgba(255, 20, 147, 0.5));
            box-shadow: 0 0 20px rgba(255, 105, 180, 0.12);
            transform: translateY(-1px);
        }

        .signup-link {
            margin-top: 20px;
            font-size: 13px;
            color: rgba(255, 105, 180, 0.35);
        }

        .signup-link a {
            color: #ff69b4;
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .signup-link a:hover {
            color: #ff99cc;
        }

        .back-link {
            display: block;
            margin-top: 16px;
            font-size: 12px;
            color: rgba(255, 105, 180, 0.25);
            text-decoration: none;
            letter-spacing: 1px;
            transition: color 0.3s ease;
        }

        .back-link:hover {
            color: rgba(255, 105, 180, 0.5);
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <h2>Login</h2>
            <p class="login-subtitle">Secure access to the IDS platform</p>

            {% if error %}
                <div class="error-message">{{ error }}</div>
            {% endif %}

            <form method="post">
                {% csrf_token %}
                <div class="form-group">
                    <input type="text" name="username" placeholder="Username" required>
                </div>
                <div class="form-group">
                    <input type="password" name="password" placeholder="Password" required>
                </div>
                <button type="submit" class="login-btn">Login</button>
            </form>

            <p class="signup-link">Don't have an account? <a href="{% url 'signup' %}">Sign Up</a></p>
            <a href="{% url 'home' %}" class="back-link">&#8592; Back to Home</a>
        </div>
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{% block title %}GrNN Threat Analyzer{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"/>
</head>
<body>

  <!-- Top Navigation -->
  <nav class="navbar">
    <div class="nav-brand">
      <div class="brand-icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
        </svg>
      </div>
      <span class="brand-name">GrNN Analyzer</span>
      <span class="brand-tag">Network Threat Intelligence</span>
    </div>
    <div class="nav-links">
      <a href="/" class="nav-link {% if request.path == '/' %}active{% endif %}">Home</a>
      <a href="/dashboard" class="nav-link {% if request.path == '/dashboard' %}active{% endif %}">Live Monitor</a>
      <a href="/analyze" class="nav-link {% if request.path == '/analyze' %}active{% endif %}">Analyze</a>
    </div>
    <div class="nav-status">
      <span class="status-dot {% if model_ready is defined and model_ready %}online{% else %}sim{% endif %}"></span>
      <span class="status-text">{% if model_ready is defined and model_ready %}Model Active{% else %}Simulation Mode{% endif %}</span>
    </div>
  </nav>

  <!-- Main content -->
  <main>
    {% block content %}{% endblock %}
  </main>

  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
